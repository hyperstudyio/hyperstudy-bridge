[project]
name = "frenz-lsl-bridge"
version = "0.1.10"
description = "Bridge between Earable FRENZ brainband (via frenztoolkit) and Lab Streaming Layer"
requires-python = ">=3.9,<3.10"
dependencies = ["frenztoolkit==0.3.2", "pylsl>=1.16", "bleak==1.0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["frenz_lsl_bridge.py", "frenz_streams.py", "frenz_discovery.py", "frenz_bluetooth.py", "frenz_permission.py"]
