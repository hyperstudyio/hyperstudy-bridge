[package]
name = "hyperstudy-bridge"
version = "0.8.28"
description = "HyperStudy Bridge - Hardware Device Integration"
authors = ["Luke Chang <luke.j.chang@dartmouth.edu>"]
license = "MIT"
repository = "https://github.com/ljchang/hyperstudy-bridge"
homepage = "https://github.com/ljchang/hyperstudy-bridge"
edition = "2021"

[lib]
name = "hyperstudy_bridge"
path = "src/lib.rs"

[[bin]]
name = "hyperstudy-bridge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Core
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["full"] }

# Device Communication
serialport = "4.5"
socket2 = "0.5"
tokio-tungstenite = "0.27"
tungstenite = "0.27"
# LSL - using main branch for Apple Clang 17+ compatibility fix (liblsl 1.16.2)
# See: https://github.com/labstreaminglayer/liblsl-rust/issues/5
lsl = { git = "https://github.com/labstreaminglayer/liblsl-rust.git", branch = "main" }

# HTTP Client (for Neon REST API)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# mDNS/DNS-SD browse (Neon Companion phones advertise as PI monitor:<name>:<id>)
mdns-sd = "0.21"

# Utilities
sha2 = "0.10"
tokio-util = { version = "0.7", features = ["io"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }

# Performance Monitoring
metrics = "0.24"
metrics-exporter-prometheus = "0.17"
sysinfo = "0.37"
histogram = "0.11"

# State Management
parking_lot = "0.12"
dashmap = "6"
uuid = { version = "1", features = ["v4"] }

# Database
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
libc = "0.2"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate"] }
base64 = "0.22"

# Runtime dynamic loading (for optional SDK integration, e.g. EyeLink)
libloading = "0.8"

# Testing utilities
rand = "0.9"

# Plugins
tauri-plugin-dialog = "2"
tauri-plugin-stronghold = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Credential storage (rust-argon2 provides hash_raw API used by stronghold examples)
rust-argon2 = "2"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tokio-test = "0.4"
tauri = { version = "2", features = ["test"] }

[[bench]]
name = "performance"
harness = false


[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true

# Stronghold snapshot encryption must not spend minutes in unoptimized rounds.
# Work factors and encryption settings are unchanged.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
